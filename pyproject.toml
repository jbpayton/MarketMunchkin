[project]
name = "marketmunchkin"
version = "0.1.0"
description = "Autonomous LLM trading agent (Alpaca paper) driven by a local LM Studio model"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.42",
    "pandas>=2.2",
    "numpy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
    "trafilatura>=1.12",
    "yfinance>=0.2.50",
    "lxml>=5",
    "beautifulsoup4>=4.12",
    "tenacity>=8",
    "pytz",
]

[project.scripts]
munchkin = "munchkin.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["munchkin*"]
